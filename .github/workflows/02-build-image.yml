name: Build & Push Docker Image
run-name: "Build | ${{ github.ref_name }} | ${{ github.sha }}"

on:
  push:
    tags:
        - "v*.*.*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
        image_tag: "${{ steps.meta.outputs.image_tag }}" 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Image tag
        
        id: meta 
        run: |
          if ! echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}. Expected format: v1.2.3"
            exit 1
          fi
          echo "image_tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push PROD image (basePath=/hospital)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hospital-front-end:${{steps.meta.outputs.image_tag}}
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/hospital

      - name: Build and push K3s image (no basePath)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hospital-front-end-staging:${{steps.meta.outputs.image_tag}}
          build-args: |
            NEXT_PUBLIC_BASE_PATH=

      - name: Trigger PROD deploy
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          DEPLOY_REPO_OWNER: ${{ secrets.DEPLOY_REPO_OWNER }}
          DEPLOY_REPO_NAME: ${{ secrets.DEPLOY_REPO_NAME }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          IMAGE_REPO: ${{ secrets.DOCKER_USERNAME }}/hospital-front-end
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOY_REPO_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOY_REPO_OWNER}/${DEPLOY_REPO_NAME}/dispatches" \
            -d "{
              \"event_type\":\"frontend_image_built\",
              \"client_payload\":{
                \"image_tag\":\"${IMAGE_TAG}\",
                \"image_repo\":\"${IMAGE_REPO}\"
              }
            }"

      - name: Trigger K3s deploy
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          DEPLOY_REPO_OWNER: ${{ secrets.DEPLOY_REPO_OWNER }}
          DEPLOY_REPO_NAME: ${{ secrets.DEPLOY_REPO_NAME }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          IMAGE_REPO: ${{ secrets.DOCKER_USERNAME }}/hospital-front-end-staging
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOY_REPO_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOY_REPO_OWNER}/${DEPLOY_REPO_NAME}/dispatches" \
            -d "{
              \"event_type\":\"frontend_k3s_image_built\",
              \"client_payload\":{
                \"image_tag\":\"${IMAGE_TAG}\",
                \"image_repo\":\"${IMAGE_REPO}\"
              }
            }"
